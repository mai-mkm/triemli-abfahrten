<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Triemli Abfahrten</title><style>
*{box-sizing:border-box}body{font:17px -apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f2f4f7;color:#172334;margin:0;padding:18px}main{max-width:640px;margin:auto}h1{font-size:28px;margin:8px 0}p{color:#526174}button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;background:#175b9e;color:white;flex:1}button.secondary{background:#dce6f1;color:#183c60}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.trip{background:white;border-radius:14px;padding:14px;margin:10px 0;display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center}.line{text-align:center}.number{display:block;background:#175b9e;color:white;font-size:23px;font-weight:700;border-radius:8px;padding:7px}.kind,small{font-size:12px;color:#526174}.destination{font-weight:700;overflow-wrap:anywhere}.count{font-size:30px;font-weight:700;text-align:right}.late{color:#b42318}.ok{color:#087443}#status{font-size:14px}a{color:#175b9e}@media(prefers-color-scheme:dark){body{background:#111827;color:#f1f5f9}.trip{background:#202c3c}p,.kind,small{color:#b9c6d5}.late{color:#ff9990}.ok{color:#83e5b1}a{color:#9bcaff}}
#stopSearch{width:100%;font:inherit;padding:12px;border:1px solid #9aa9ba;border-radius:10px;background:transparent;color:inherit}#stopList{max-height:300px;overflow:auto;border:1px solid #9aa9ba;border-radius:10px;margin:8px 0}#stopList button{display:block;width:100%;text-align:left;background:transparent;color:inherit;border-radius:0;border-bottom:1px solid #9aa9ba;font-weight:400}#stopList button small{display:block}#picker summary{cursor:pointer;font-weight:600;padding:12px 0}.operator{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px;flex-wrap:wrap}.operator-mark{display:inline-block;padding:3px 6px;border-radius:4px;font-weight:800;letter-spacing:.2px;color:white;background:#526174;line-height:1.2}.op-vbz,.op-zvv{background:#005ca9}.op-sbb,.op-db{background:#c90020}.op-post{background:#ffcc00;color:#202020}.op-sncf{background:#8b235e}.op-szu{background:#14794d}.op-bls{background:#176b99}.op-sob{background:#b92727}.op-rhb{background:#c62828}</style></head><body><main><h1 id="stopTitle">Zürich, Triemli</h1><p>Abfahrten des öffentlichen Verkehrs</p><details id="picker"><summary>Haltestelle auswählen</summary><input id="stopSearch" type="search" placeholder="Name oder Zahlencode eingeben" autocomplete="off" aria-label="Haltestelle suchen"><p id="stopInfo" role="status"></p><div id="stopList"></div><button id="moreStops" class="secondary" hidden>Weitere Haltestellen</button><p><small>Haltestellenverzeichnis: <a href="https://data.sbb.ch/explore/dataset/dienststellen-gemass-opentransportdataswiss/">SBB / DiDok</a></small></p></details><nav><button id="refresh">Aktualisieren</button><button id="window" class="secondary">Nächste 10 Min.</button></nav><p id="status" role="status">JavaScript wird gestartet …</p><section id="board" aria-live="polite"></section><p><small>Fahrplandaten: <a href="https://opentransportdata.swiss/">opentransportdata.swiss</a> via <a href="https://transport.opendata.ch/">transport.opendata.ch</a>. Zeiten ohne Echtzeitprognose sind Fahrplanzeiten.</small></p><noscript>Bitte JavaScript in Safari aktivieren.</noscript></main><script>
'use strict';
let selected={id:'8503610',name:'Zürich, Triemli'},generation=0;try{const s=JSON.parse(localStorage.getItem('selectedStop'));if(s&&s.id&&s.name)selected=s}catch(e){};document.getElementById('stopTitle').textContent=selected.name+' · '+selected.id;let horizon=30,rows=[],loaded=false,updated=null,loading=false,error='';
const status=document.getElementById('status'),board=document.getElementById('board'),toggle=document.getElementById('window');
const fmt=new Intl.DateTimeFormat('de-CH',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Zurich'});
function time(v){if(!v)return NaN;return Date.parse(String(v).replace(/([+-]\d{2})(\d{2})$/,'$1:$2'))}
function kind(d){const c=String(d.category||'').toUpperCase(),o=String(d.operator||'');if(c==='T'||c==='TRAM')return 'Tram';if(/postauto|postbus/i.test(o))return 'Postauto';if(c==='B'||c==='BUS'||c==='NFB')return /VBZ|Verkehrsbetriebe Zürich/i.test(o)?'Stadtbus':'Bus';return c==='S'?'S-Bahn':c==='FUN'?'Standseilbahn':c||'ÖV'}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function operatorBadge(d){const raw=String(d.operator??'').trim(), key=raw.toUpperCase();const brands=[
[/^(VBZ)(?:\b|[-_])|VERKEHRSBETRIEBE Z[ÜU]RICH/i,'VBZ','vbz','Verkehrsbetriebe Zürich'],
[/^ZVV\b|Z[ÜU]RCHER VERKEHRSVERBUND/i,'ZVV','zvv','Zürcher Verkehrsverbund'],
[/^(SBB|CFF|FFS)(?:\b|[-_])|SCHWEIZERISCHE BUNDESBAHNEN/i,'SBB','sbb','Schweizerische Bundesbahnen'],
[/^PAG\b|^PA$|POST\s*AUTO|POSTBUS|CARPOSTAL|AUTOPOSTALE/i,'PostAuto','post','PostAuto'],
[/^DB(?:\b|[-_])|DEUTSCHE BAHN/i,'DB','db','Deutsche Bahn'],
[/^SNCF(?:\b|[-_])|^TGV LYRIA/i,'SNCF','sncf','SNCF'],
[/^SZU(?:\b|[-_])|SIHLTAL.*UETLIBERG/i,'SZU','szu','Sihltal Zürich Uetliberg Bahn'],
[/^BLS(?:\b|[-_])/i,'BLS','bls','BLS'],
[/^SOB(?:\b|[-_])|S[ÜU]DOSTBAHN/i,'SOB','sob','Schweizerische Südostbahn'],
[/^RHB(?:\b|[-_])|RH[ÄA]TISCHE BAHN/i,'RhB','rhb','Rhätische Bahn'],
[/^ÖBB(?:\b|[-_])|^OEBB(?:\b|[-_])/i,'ÖBB','db','Österreichische Bundesbahnen'],
[/^TPG(?:\b|[-_])/i,'TPG','','Transports publics genevois'],
[/^TL(?:\b|[-_])/i,'tl','','Transports publics lausannois'],
[/^BVB(?:\b|[-_])/i,'BVB','szu','Basler Verkehrs-Betriebe'],
[/^BLT(?:\b|[-_])/i,'BLT','post','Baselland Transport']
];const brand=brands.find(b=>b[0].test(key));const row=el('div','operator');if(brand){const mark=el('span','operator-mark op-'+brand[2],brand[1]);mark.title=brand[3];row.append(mark);row.setAttribute('aria-label','Betreiber: '+brand[3]);if(/^TGV LYRIA/i.test(raw))row.append(el('span','',raw));}else{row.append(el('span','operator-mark','ÖV'),el('span','',raw||'Betreiber unbekannt'));}return row}
function render(){toggle.textContent=horizon===30?'Nächste 10 Min.':'Nächste 30 Min.';const now=Date.now();status.textContent=(loading?'Daten werden geladen …':error?error:loaded?'Nächste '+horizon+' Min. · Stand '+fmt.format(updated):'Noch keine Daten');board.replaceChildren();const visible=rows.map(d=>{const s=d.stop||{},plan=time(s.departure),p=time(s.prognosis&&s.prognosis.departure),delay=s.delay==null?null:Number(s.delay);return {d,plan,actual:Number.isFinite(p)?p:Number.isFinite(delay)?plan+delay*60000:plan,delay:Number.isFinite(p)&&Number.isFinite(plan)?Math.round((p-plan)/60000):delay}}).filter(x=>Number.isFinite(x.actual)&&x.actual>=now&&x.actual<=now+horizon*60000).sort((a,b)=>a.actual-b.actual);
for(const x of visible){const d=x.d,trip=el('article','trip'),line=el('div','line'),info=el('div'),right=el('div','count');line.append(el('span','number',d.number||d.name||'–'),el('span','kind',kind(d)));info.append(el('div','destination',d.to||'Unbekannt'),operatorBadge(d),el('small','', 'Plan: '+(Number.isFinite(x.plan)?fmt.format(x.plan):'–')),el('div',x.delay>0?'late':x.delay===0?'ok':'kind',x.delay==null?'Verspätung unbekannt':x.delay===0?'Pünktlich':(x.delay>0?'+':'')+x.delay+' Min.'));right.append(el('div','',String(Math.ceil((x.actual-now)/60000))),el('small','','Min.'));trip.append(line,info,right);board.append(trip)}
if(loaded&&!visible.length&&!error)board.append(el('p','','Keine Abfahrten im gewählten Zeitraum.'))}
async function refresh(){if(loading)return;loading=true;const requestGeneration=generation;error='';render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const url=new URL('https://transport.opendata.ch/v1/stationboard');url.searchParams.set('id',selected.id);url.searchParams.set('limit','100');const r=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.stationboard))throw Error('Keine Abfahrtsliste erhalten');if(requestGeneration!==generation)return;rows=data.stationboard;loaded=true;updated=new Date()}catch(e){if(requestGeneration!==generation)return;error='Abruf fehlgeschlagen: '+(e.name==='AbortError'?'Zeitüberschreitung':e.message)+'. Bitte erneut aktualisieren.'}finally{clearTimeout(timer);loading=false;render();if(requestGeneration!==generation)refresh()}}
document.getElementById('refresh').addEventListener('click',refresh);toggle.addEventListener('click',()=>{horizon=horizon===30?10:30;render()});setInterval(()=>{render();if(!document.hidden)refresh();},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});refresh();

const picker=document.getElementById('picker'),search=document.getElementById('stopSearch'),list=document.getElementById('stopList'),info=document.getElementById('stopInfo'),more=document.getElementById('moreStops');
let allStops=null,stopLoading=false,shown=0,matches=[];
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('de-CH').trim();
function chooseStop(s){selected=s;generation++;rows=[];loaded=false;error='';updated=null;document.getElementById('stopTitle').textContent=s.name+' · '+s.id;try{localStorage.setItem('selectedStop',JSON.stringify(s))}catch(e){}picker.open=false;search.blur();render();refresh()}
function appendStops(){const end=Math.min(shown+100,matches.length);for(;shown<end;shown++){const s=matches[shown],b=el('button','',s.name+' — '+s.id);b.type='button';b.addEventListener('click',()=>chooseStop(s));list.append(b)}more.hidden=shown>=matches.length;info.textContent=matches.length.toLocaleString('de-CH')+' Haltestellen · '+shown+' angezeigt'}
function filterStops(){if(!allStops)return;const q=norm(search.value);matches=allStops.filter(s=>!q||norm(s.name).startsWith(q)||s.id.startsWith(q));if(q&&!matches.length)matches=allStops.filter(s=>norm(s.name).includes(q));shown=0;list.replaceChildren();list.scrollTop=0;appendStops()}
async function loadStops(){if(allStops||stopLoading)return;stopLoading=true;info.textContent='Haltestellenverzeichnis wird geladen …';try{const u=new URL('https://data.sbb.ch/api/explore/v2.1/catalog/datasets/dienststellen-gemass-opentransportdataswiss/exports/json');u.searchParams.set('select','designationofficial,number,stoppoint');u.searchParams.set('where',"uiccountrycode=85");const response=await fetch(u);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw Error('Ungültiges Verzeichnis');const map=new Map();for(const x of data){if(!x.designationofficial||!x.number||!['true','1','yes','ja'].includes(String(x.stoppoint).toLowerCase()))continue;const id=String(x.number);map.set(id,{id,name:x.designationofficial})}if(!map.size)throw Error('Keine Haltestellen im Verzeichnis');allStops=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'de-CH')||a.id.localeCompare(b.id));filterStops()}catch(e){info.textContent='Verzeichnis nicht verfügbar: '+e.message+'. Auswahl erneut öffnen oder Suchbegriff eingeben.'}finally{stopLoading=false}}
picker.addEventListener('toggle',()=>{if(picker.open)loadStops()});search.addEventListener('input',()=>{if(allStops)filterStops();else loadStops()});more.addEventListener('click',appendStops);
</script></body></html>
